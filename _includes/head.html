<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | truncate: 160 }}">
<meta name="theme-color" content="#ef2e31">
{% if page.header_image %}<meta property="og:image" content="{{ page.header_image | absolute_url }}">{% endif %}
<link rel="icon" href="{{ site.favicon | default: '/assets/images/favicon.svg' | relative_url }}">
<!-- Bulma (MIT) — https://bulma.io/documentation/ -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
<link rel="stylesheet" href="{{ '/assets/css/theme.css' | relative_url }}">
{% if site.theme_color %}<style>:root{--mks-primary: {{ site.theme_color }};}</style>{% endif %}
{% feed_meta %}
