# =====================================================================
#  MES COMPÉTENCES — alimente le radar et la page /competences/
#
#  ⚠️ Le référentiel ci-dessous est un EXEMPLE. L'équipe pédagogique
#     fournit la liste officielle de ta formation : garde les "id",
#     "nom" et "description" qu'elle donne, et remplis toi-même
#     "niveau", "justification" et "autres_preuves".
#
#  Les preuves "projets / articles / docs" sont ajoutées
#  AUTOMATIQUEMENT : il suffit d'écrire  competences: [C1, C3]
#  dans le front matter d'un projet, d'un article ou d'une doc.
# =====================================================================

referentiel: "Référentiel de compétences — exemple à remplacer"
niveau_max: 4
niveaux:                       # signification de chaque niveau (1 à niveau_max)
  - "Découverte : j'ai pratiqué une fois, avec beaucoup d'aide"
  - "Application : je sais le refaire en suivant une méthode"
  - "Maîtrise : je le fais en autonomie et je sais justifier mes choix"
  - "Expertise : je sais l'adapter à un contexte nouveau et l'expliquer à d'autres"

competences:
  - id: C1
    nom: "Analyser un besoin et rédiger un cahier des charges"
    court: "Besoin & CdC"       # libellé court affiché sur le radar (optionnel)
    description: "Identifier les attentes, les contraintes et les critères de validation d'un projet."
    niveau: 2                   # mon niveau actuel (0 à niveau_max)
    objectif: 3                 # niveau visé en fin d'année (optionnel)
    justification: |
      Sur le projet **Robot suiveur de ligne**, j'ai rédigé le cahier des charges
      avec mon équipe et défini les critères de réussite (vitesse, précision).
      Je dois encore progresser sur la priorisation des exigences.
    autres_preuves:
      - titre: "Atelier Méthodologie de projet — séance 2"
        lien: "https://doc.makerspace-amiens.fr/workshops/methodologie-de-projet/"
        description: "Cahier des charges rendu et évalué."
        icon: graduation-cap

  - id: C2
    nom: "Concevoir une solution technique"
    court: "Conception"
    description: "Proposer, comparer et dimensionner des solutions répondant au besoin."
    niveau: 2
    objectif: 3
    justification: |
      Conception CAO du châssis et choix des moteurs en comparant trois solutions.

  - id: C3
    nom: "Prototyper et fabriquer"
    court: "Prototypage"
    description: "Réaliser un prototype avec les moyens du MakerSpace (impression 3D, découpe laser, électronique)."
    niveau: 3
    objectif: 3
    justification: |
      Impression 3D et découpe laser des pièces, montage et câblage du robot.
    autres_preuves:
      - titre: "Certification sécurité MakerSpace"
        description: "Formé à la découpeuse laser et aux imprimantes 3D."
        icon: shield-check

  - id: C4
    nom: "Tester, mesurer et valider"
    court: "Tests"
    description: "Mettre en place des essais, exploiter les mesures et conclure."
    niveau: 1
    objectif: 3

  - id: C5
    nom: "Travailler en équipe et gérer un projet"
    court: "Équipe & projet"
    description: "S'organiser, planifier, communiquer et utiliser les outils de gestion de projet."
    niveau: 2
    objectif: 3

  - id: C6
    nom: "Communiquer et documenter"
    court: "Communication"
    description: "Rendre un travail compréhensible et transmissible, à l'écrit comme à l'oral."
    niveau: 2
    objectif: 4
    justification: |
      Ce site lui-même : documentation des projets au fil de l'eau et journal de bord.
